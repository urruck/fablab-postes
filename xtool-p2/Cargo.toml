[package]
name = "xtool-p2"
version = "0.1.0"
edition = "2024"
description = "Outil open-source pour piloter la xTool P2 sous Linux"
license = "GPL-3.0"
authors = ["Boc@l FabLab Chemillé"]

[[bin]]
name = "xtool-p2"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
